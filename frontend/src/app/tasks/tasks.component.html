<div class="container">
  <h1>Task Tracker</h1>

  <div *ngIf="error" class="error">{{ error }}</div>

  <form class="add-form" (ngSubmit)="add()">
    <input
      type="text"
      [(ngModel)]="newTitle"
      name="newTitle"
      placeholder="New task…"
      autocomplete="off"
    />
    <button type="submit">Add</button>
  </form>

  <ul class="task-list">
    <li *ngFor="let task of tasks" [class.done]="task.done">
      <span class="title">{{ task.title }}</span>
      <div class="actions">
        <button
          *ngIf="!task.done"
          class="btn-done"
          (click)="markDone(task)"
          title="Mark as done"
        >
          ✓
        </button>
        <button class="btn-delete" (click)="delete(task)" title="Delete">✕</button>
      </div>
    </li>
    <li *ngIf="tasks.length === 0" class="empty">No tasks yet. Add one above!</li>
  </ul>
</div>
